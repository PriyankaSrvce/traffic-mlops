name: Phase 2 CI

on:
  push:
    branches: [main, "phase2-*", "phase3-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Trigger Render deployment to the protected production environment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Phase 2 and Phase 1 test dependencies
        run: python -m pip install -r requirements-phase2.txt -r requirements-test-phase1.txt

      - name: Compile project Python files
        run: python -m compileall -q src sumo flows scripts tests

      - name: Run complete test suite with pytest
        run: python -m pytest tests -v --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml

      - name: Evaluate retraining trigger on the committed drift report
        run: |
          code=0
          python scripts/retraining_trigger.py --drift-report reports/phase3_drift/drift_report.json --request-file "$RUNNER_TEMP/retraining_request.json" || code=$?
          cat "$RUNNER_TEMP/retraining_request.json"
          # 0 = no retraining needed, 10 = retraining triggered; anything else is a real failure.
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then exit "$code"; fi

      - name: Validate Metaflow graph
        run: python flows/queue_model_flow.py --metadata=local --datastore=local check

      - name: Validate Bengaluru Metaflow graph
        run: python flows/bengaluru_queue_model_flow.py --metadata=local --datastore=local check

      - name: Build API container
        run: docker build --tag traffic-queue-api:ci .

      - name: Smoke-test container observability endpoints
        run: |
          docker run -d --name api-smoke -p 8000:8000 traffic-queue-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/metrics > metrics.txt && break; sleep 2; done
          # No model artifact is mounted in CI, so the API must report "not loaded" instead of serving.
          grep -q '^queue_model_loaded 0' metrics.txt
          curl -sf -o /dev/null http://localhost:8000/dashboard
          curl -sf -o /dev/null http://localhost:8000/reports/evidently/surge_600_occupied_lanes
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "503"
          docker logs api-smoke 2>&1 | grep -q 'model_missing'
          docker rm -f api-smoke

  deploy:
    needs: checks-and-image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Trigger Render deployment after successful checks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Render deployment was requested, but required deployment secrets are not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 "$RENDER_SERVICE_URL/health" || true)
            if [ "$status" = "200" ]; then
              echo "Render service health check passed."
              exit 0
            fi
            sleep 20
          done
          echo "Render service did not become healthy within 10 minutes."
          exit 1
