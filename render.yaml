services:
  - type: web
    name: traffic-queue-api
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: QUEUE_MODEL_PATH
        value: /tmp/queue-model.joblib
      - key: QUEUE_MODEL_METADATA_PATH
        value: /app/src/api/bengaluru_deployment_metadata.json
      - key: QUEUE_MODEL_URL
        sync: false
      # Metaflow run 1794405200312669 model. QUEUE_MODEL_URL (set in the Render
      # dashboard) must serve exactly these bytes, or startup fails by design.
      - key: QUEUE_MODEL_SHA256
        value: 167b523fc8c89199f6a8bf0689475272654db96b59b8a1da9b8a9986bff0b13b
