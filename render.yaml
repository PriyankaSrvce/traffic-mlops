services:
  - type: web
    name: traffic-queue-api
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: QUEUE_MODEL_PATH
        value: /tmp/queue-model.joblib
      - key: QUEUE_MODEL_METADATA_PATH
        value: /app/src/api/bengaluru_deployment_metadata.json
      - key: QUEUE_MODEL_URL
        sync: false
      # Metaflow run 3 model (v2, drift-retrained). QUEUE_MODEL_URL (set in the Render
      # dashboard) must serve exactly these bytes, or startup fails by design.
      - key: QUEUE_MODEL_SHA256
        value: 8da60b0e70a0e38c3e4c5d82eefd47fd170949997e62b9bbf3f573ebb03c0804
