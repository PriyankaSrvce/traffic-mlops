# Local observability stack for the Phase 3 demo: API + Prometheus + Grafana.
#
#   MODEL_DIR=/path/to/folder/with/the/model docker compose up -d --build
#
# MODEL_DIR must contain bengaluru_queue_hurdle_v1_2026-11.joblib (the approved model; the
# container refuses to start if its SHA-256 differs from the pinned value).
# Grafana:    http://localhost:3000  (dashboard "Traffic Queue Model - MLOps Monitoring")
# Prometheus: http://localhost:9090
# API:        http://localhost:8000/dashboard
# Ports are bound to 127.0.0.1 only; this stack is for a local demo, not for production.
name: traffic-monitoring
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR to the folder that holds the approved model file}:/models:ro
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/traffic_mlops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
