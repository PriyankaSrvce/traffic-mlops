# Local observability stack for the Phase 3 demo: API + Prometheus + Grafana.
#
#   docker compose up -d --build
#
# The API container downloads the production model itself (QUEUE_MODEL_URL below, the
# registry's artifact_url) and refuses to start unless its SHA-256 equals the value pinned
# in the Dockerfile. Offline use with a local copy: see docker-compose.local-model.yml.
# Grafana:    http://localhost:3000  (dashboard "Traffic Queue Model - MLOps Monitoring")
# Prometheus: http://localhost:9090
# API:        http://localhost:8000/dashboard
# Ports are bound to 127.0.0.1 only; this stack is for a local demo, not for production.
name: traffic-monitoring
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
      QUEUE_MODEL_PATH: /tmp/queue-model.joblib
      # Production model (registry/model_versions.json). Keep in step with the Dockerfile SHA;
      # a unit test checks that both name the registry's production entry.
      QUEUE_MODEL_URL: ${QUEUE_MODEL_URL:-https://raw.githubusercontent.com/PriyankaSrvce/traffic-mlops/model-8da6/bengaluru_queue_hurdle_v1_2026-11.joblib}
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/traffic_mlops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
